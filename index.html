<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Trend Radar</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --line: #e2e6ec; --text: #1b1f24;
    --muted: #6b7280; --accent: #2f6fec; --accent-text: #ffffff; --green: #0b8a55; --green-bg: #e2f5ea;
    --red: #d6363b; --notice-bg: #fff4d6; --notice-text: #8a5a00; --group-bg: #f1f4f9;
    --tab-on: #eaf1ff; --heat: 11,138,85; --up: #d6363b; --dn: #2f6fec; --wr: #6250d6;
    --grid: rgba(0,0,0,0.07); --tip-bg: #ffffff;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #111317; --panel: #1a1d23; --line: #2a2e36; --text: #e8eaed;
    --muted: #8b919c; --accent: #4f8cff; --green: #3ecf8e; --green-bg: #1e3a2c;
    --red: #ff7a7a; --notice-bg: #3a2d12; --notice-text: #f5c66b; --group-bg: #15181d;
    --tab-on: #1d2533; --heat: 62,207,142; --up: #ff6b6b; --dn: #5b9dff; --wr: #9085e9;
    --grid: rgba(255,255,255,0.06); --tip-bg: #0b0c0f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  header { padding: 24px 16px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: relative; }
  #theme { position: absolute; top: 18px; right: 16px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  header h1, header .sub { padding-right: 96px; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
  .tagline { color: var(--text); font-size: 14px; margin: -2px 0 8px; padding-right: 96px; }
  .sub { color: var(--muted); font-size: 13px; line-height: 1.5; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .tabs button { flex: 0 0 auto; background: var(--panel); color: var(--muted); border: 1px solid var(--line);
                 border-radius: 10px; padding: 10px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .tabs button.on { color: var(--text); border-color: var(--accent); background: var(--tab-on); font-weight: 600; }
  .notice { background: var(--notice-bg); color: var(--notice-text); border-radius: 10px; padding: 10px 14px;
            font-size: 13px; margin-bottom: 14px; }
  .controls { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
              padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .controls label { color: var(--muted); font-size: 14px; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line);
           border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 15px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { background: transparent; color: var(--muted); border: 1px solid var(--line);
                border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .note { width: 100%; color: var(--muted); font-size: 12px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
            padding: 16px; margin-top: 16px; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sec-head h2 { margin: 0; font-size: 20px; }
  .rule { font-family: var(--mono); color: var(--muted); font-size: 13px; }
  .count { margin-left: auto; color: var(--muted); font-size: 13px; }
  .changes { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px;
             margin: 12px 0; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
  .changes .out { color: var(--red); font-weight: 600; }
  .changes .in { color: var(--green); font-weight: 600; }
  .tag { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px;
       padding: 8px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  a.name { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  a.name:hover { color: var(--accent); }
  .badge { display: inline-block; margin-left: 6px; background: var(--green-bg); color: var(--green);
           font-size: 11px; padding: 2px 6px; border-radius: 5px; white-space: nowrap; }
  .sector { color: var(--muted); }
  .group td { background: var(--group-bg); color: var(--accent); font-weight: 600; font-size: 13px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; line-height: 1.6; }
  .heat { overflow-x: auto; }
  .heat table { font-size: 13px; }
  .heat td.c { text-align: center; font-variant-numeric: tabular-nums; padding: 8px 4px; min-width: 34px; }
  .heat th.c { text-align: center; padding: 8px 4px; font-weight: 500; }
  .heat td.sname { white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .heat th:first-child, .heat td.sname { position: sticky; left: 0; background: var(--panel); z-index: 1; }
  input.search { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; flex: 1 1 140px; min-width: 0; }
  .delta-up { color: var(--green); } .delta-dn { color: var(--red); }
  .chart-box { position: relative; height: 260px; margin: 12px 0 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .legend i, .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .ret-up { color: var(--up); } .ret-dn { color: var(--dn); }
  .rt td, .rt th { padding: 8px 4px; font-size: 13px; }
  .rt { margin-top: 8px; }
  .rt td:first-child { white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .rt .sw { margin-right: 6px; }
  .rt-wrap { overflow-x: auto; }
  .badge.hot { background: var(--notice-bg); color: var(--notice-text); }
  .score { display: inline-block; min-width: 30px; text-align: center; padding: 2px 6px; border-radius: 6px;
           font-variant-numeric: tabular-nums; font-size: 13px; }
  .score.hi { background: var(--green-bg); color: var(--green); font-weight: 700; }
  .score.mid { color: var(--text); } .score.lo { color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .d { font-size: 12px; margin-top: 2px; }
  .mood { font-size: 14px; margin-top: 4px; }
  .mini-chart { position: relative; height: 170px; }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary h2::after { content: ' ▾'; color: var(--muted); font-size: 14px; }
  details[open] > summary h2::after { content: ' ▴'; }
  .sc td, .sc th { padding: 7px 4px; font-size: 13px; }
  .sc td:first-child { white-space: nowrap; }
  .sc tr.base { opacity: .8; }
  .sc tr.yrs td { padding-top: 0; font-size: 11px; color: var(--muted); white-space: normal; border-bottom: 1px solid var(--line); }
  .sc tr.yrs + tr td, .sc tr:has(+ tr.yrs) td { border-bottom: none; }
  .yr { display: inline-block; margin-right: 8px; white-space: nowrap; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 5px; margin: 2px 4px 0 0;
          border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.on { border-color: var(--accent); color: var(--accent); background: var(--tab-on); }
  .chip.w { border-color: var(--notice-text); color: var(--notice-text); background: var(--notice-bg); }
  .chip.r { border-color: var(--red); color: var(--red); }
  .dots { letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
  .dots .off { color: var(--line); }
  .lvl { display: inline-block; min-width: 22px; text-align: center; border-radius: 6px; padding: 2px 6px; font-weight: 700; font-size: 12px; }
  .lvl.l1 { background: var(--notice-bg); color: var(--notice-text); }
  .lvl.l2 { background: var(--red); color: #fff; }
  .alert { border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 14px; line-height: 1.5; border: 1px solid; }
  .alert b { display: block; margin-bottom: 2px; }
  .alert.danger { background: rgba(214,54,59,0.10); border-color: var(--red); }
  .alert.warn { background: var(--notice-bg); border-color: var(--notice-text); color: var(--notice-text); }
  .alert.good { background: var(--green-bg); border-color: var(--green); }
  .views { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 16px; }
  .views button { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px;
                  font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; }
  .views button b { display: block; font-size: 20px; color: var(--text); margin-top: 2px; }
  .views button.on { border-color: var(--accent); background: var(--tab-on); color: var(--text); font-weight: 600; }
  .defs { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  .defs b { color: var(--text); }
  .sub-h { font-size: 14px; font-weight: 700; margin: 16px 0 4px; }
  .toggle { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .g { display: inline-block; min-width: 20px; text-align: center; border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: 12px; }
  .g.A { background: var(--green); color: #fff; } .g.B { background: var(--green-bg); color: var(--green); }
  .g.C { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .chip.A { border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .chip.B { border-color: var(--green); color: var(--green); }
  .chip.C { color: var(--muted); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal .box { background: var(--panel); color: var(--text); width: 100%; max-width: 760px; max-height: 92vh; overflow-y: auto;
                border-radius: 16px 16px 0 0; padding: 16px; }
  @media (min-width: 700px) { .modal { align-items: center; } .modal .box { border-radius: 16px; } }
  .modal .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .modal .top h2 { margin: 0; font-size: 20px; }
  .modal .x { margin-left: auto; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .stock-chart { position: relative; height: 280px; margin: 10px 0 6px; }
  .mk { table-layout: fixed; }
  .mk td { padding: 7px 4px; font-size: 13px; }
  .mk .chip { white-space: normal; }
  .mk th:first-child, .mk td:first-child { width: 72px; padding-right: 8px; } .mk th:last-child, .mk td:last-child { width: 80px; }
  .tri-up { color: var(--up); font-weight: 700; } .tri-dn { color: var(--dn); font-weight: 700; }
  .tri-off { color: var(--muted); }
  .sb { display: inline-block; margin-left: 5px; font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 5px; white-space: nowrap; }
  .sb.up { color: #fff; background: var(--up); } .sb.dn { color: #fff; background: var(--dn); }
  .sb.pull { color: var(--notice-text); background: var(--notice-bg); } .sb.off { color: var(--muted); border: 1px solid var(--line); } .tri-pull { color: var(--notice-text); font-weight: 700; }
  .fwd-list td { font-size: 12px; padding: 6px 3px; }
  @media (max-width: 520px) { .views { grid-template-columns: repeat(2, 1fr); } .views button { font-size: 12px; padding: 8px 2px; } }
  .badge.val { background: var(--tab-on); color: var(--accent); }
  .badge.wr { background: var(--wr); color: #fff; font-weight: 700; }
  .wrc { display: inline-flex; align-items: center; gap: 5px; justify-content: flex-end; }
  .rng { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .rngbar { position: relative; width: 56px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--dn), var(--line) 50%, var(--up)); }
  .rngbar i { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--text); border: 2px solid var(--panel); box-sizing: border-box; box-shadow: 0 0 0 1px var(--text); }
  .rlab { font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .rlab.hi { color: var(--up); } .rlab.lo { color: var(--dn); }
  .wrbar { width: 34px; height: 7px; border-radius: 4px; background: var(--grid); position: relative; overflow: hidden; }
  .wrbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--muted); border-radius: 4px; }
  .wrc.on { color: var(--wr); font-weight: 700; } .wrc.on .wrbar i { background: var(--wr); }
  .sb.wr { color: #fff; background: var(--wr); }
  .hold-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  .hold-form label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .hold-form input { width: 110px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  .hold-form button { padding: 7px 12px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .hold-form button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .hold-hint { margin: 0 0 10px; }
  .badge.dnb { background: var(--dn); color: #fff; }
  .sc td:first-child { min-width: 108px; }
  .notice a { color: inherit; font-weight: 700; }
  @media (max-width: 520px) { .sector-col { display: none; } .sc .h5 { display: none; } .sc td, .sc th { font-size: 12px; padding: 6px 3px; } .rt .y1 { display: none; } .rt td, .rt th { font-size: 12px; padding: 7px 3px; } h1 { font-size: 22px; } }
</style>
</head>
<body>
<header>
  <button id="theme" type="button">어두운 화면</button>
  <h1>Stock Trend Radar</h1>
  <div class="tagline">코스피200 · 코스닥150 정배열과 국내·미국 ETF 흐름을 매일 한눈에</div>
  <div class="sub" id="updated">불러오는 중…</div>
</header>
<main>
  <nav class="tabs" id="tabs">
    <button data-tab="kr">국내 ETF</button>
    <button data-tab="us">미국 주식/ETF</button>
    <button data-tab="kospi200">코스피200 정배열</button>
    <button data-tab="kosdaq150">코스닥150 정배열</button>
    <button data-tab="sector">섹터 흐름</button>
  </nav>
  <div id="panel"></div>
</main>

<script>
const INDEX = {
  kospi200: { name: '코스피200', dir: 'data/kospi200/' },
  kosdaq150: { name: '코스닥150', dir: 'data/kosdaq150/' },
};
const state = { vTrend: false, tab: 'kospi200', sort: 'days', q: '', view: 'today', e2: true, gA: false, date: {}, cache: {}, sectorIx: 'kospi200', sectorSec: 'short', range: '3m', mode: 'pct' };
const PALETTE = {
  light: ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948'],
  dark:  ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'],
};
let COLORS = PALETTE.light;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function applyTheme(t) {
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  COLORS = PALETTE[t === 'dark' ? 'dark' : 'light'];
  const b = document.getElementById('theme');
  if (b) b.textContent = t === 'dark' ? '밝은 화면' : '어두운 화면';
}
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch {}
applyTheme(theme);
let charts = [];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fnguide = code => `https://wcomp.fnguide.com/?cmp_cd=${code}`;
const fmtCap = v => {
  if (!v) return '-';
  const jo = v / 1e12;
  return jo >= 1 ? jo.toFixed(1) + '조' : Math.round(v / 1e8).toLocaleString() + '억';
};
const fmtTime = iso => iso ? new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) : '-';

async function getJSON(path) {
  if (state.cache[path]) return state.cache[path];
  const r = await fetch(path + '?t=' + Date.now());
  if (!r.ok) throw new Error(path);
  return (state.cache[path] = await r.json());
}

const panel = () => document.getElementById('panel');

// ---------------------------------------------------------- 정배열 탭
const OVERHEAT = 15;   // 20일선 대비 +15% 이상이면 과열 배지
const scoreCls = v => v == null ? 'lo' : v >= 70 ? 'hi' : v >= 40 ? 'mid' : 'lo';
const WR_PULL = -80;   // 윌리엄스 %R 이 이하면 '눌림' 배지 (관찰용)
// %R 바닥권이 5년 검증에서 '정배열 아무 때나'보다 못했으면 경고 표시 (지수별·국면별로 자동 판단)
let wrWarn = '';
function setWrWarn(meta) {
  const T = meta.wr_test || [], b = T.find(r => r.id === 'WT0'), w = T.find(r => r.id === 'WT1');
  const rn = meta.regime_now, rk = rn == null ? null : rn <= 20 ? 'cold' : rn >= 50 ? 'hot' : null;
  const pick = r => (rk && r[rk]) || r.all;
  wrWarn = b && w && pick(b) && pick(w) && pick(w).excess < pick(b).excess
    ? `과거 5년${rk ? (rk === 'cold' ? ' 약세장' : ' 강세장') : ''}: 이 자리에서 산 종목이 정배열 평균보다 못했음 (${pick(w).excess}% vs ${pick(b).excess}%)` : '';
}
const wrBadge = it => it.wr != null && it.wr <= WR_PULL ? `<span class="badge wr" title="윌리엄스 %R(14일) ${it.wr} — 최근 14일 범위의 하단 20% (관찰용, 규칙 아님)${wrWarn ? ' · ' + wrWarn : ''}">◆ %R 눌림 ${it.wr}</span>${wrWarn ? '<span class="badge hot" title="' + wrWarn + '">과거엔 불리</span>' : ''}` : '';
// 2주 위치: 최근 2주 최저가(왼쪽)~최고가(오른쪽) 사이 어디서 마감했나 (윌리엄스 %R을 쉬운 말로 바꾼 것)
const wrPos = wr => Math.round(100 + wr);                    // 0 = 2주 최저, 100 = 2주 최고
const wrLabel = wr => { const p = wrPos(wr); return p >= 80 ? '고점 근처' : p <= 20 ? '저점 근처' : '중간'; };
const wrCell = it => it.wr == null ? '<td class="num tag">-</td>' :
  `<td class="num"><span class="rng" title="최근 2주 가격 범위(왼쪽 끝 = 2주 최저가, 오른쪽 끝 = 2주 최고가)에서 오늘 종가의 위치. 위치 정보일 뿐 매매 신호가 아닙니다${wrWarn ? ' · ' + wrWarn : ''}"><span class="rngbar"><i style="left:${Math.min(100, Math.max(0, wrPos(it.wr)))}%"></i></span><span class="rlab ${wrPos(it.wr) >= 80 ? 'hi' : wrPos(it.wr) <= 20 ? 'lo' : ''}">${wrLabel(it.wr)}</span></span></td>`;
let curWr = {};
function row(it) {
  const hot = it.gap != null && it.gap >= OVERHEAT;
  return `<tr>
    <td><a class="name" data-code="${it.code}" href="${fnguide(it.code)}" target="_blank" rel="noopener">${esc(it.name)}</a>${sigBadge(it.code)}${it.full ? '<span class="badge">완전정배열</span>' : ''}${hot ? `<span class="badge hot" title="20일선 대비 +${it.gap}%">과열 +${Math.round(it.gap)}%</span>` : ''}${it.x5 ? '<span class="badge dnb" title="이동평균은 늦게 따라옵니다. 오늘 종가는 이미 5일선 아래로 꺾였습니다">종가 이탈</span>' : ''}${it.bigdn ? '<span class="badge dnb" title="60일선이 120일선 아래이고 종가도 60일선 아래 — 큰 흐름은 하락 추세">큰 흐름 하락</span>' : ''}</td>
    <td class="sector sector-col">${esc(it.sector)}</td>
    <td class="num">${it.days}일</td>
    ${wrCell(it)}
    <td class="num"><span class="score ${scoreCls(it.score)}" title="이격도 ${it.gap ?? '-'}% · 거래량 ${it.volr ?? '-'}배">${it.score ?? '-'}</span></td>
    <td class="num">${fmtCap(it.cap)}</td></tr>`;
}

function renderSection(s, idx) {
  const q = state.q.trim().toLowerCase();
  let items = s.items.filter(it => !q || it.name.toLowerCase().includes(q) || it.sector.toLowerCase().includes(q) || it.code.includes(q)), body;
  if (state.sort === 'cap') items.sort((a, b) => b.cap - a.cap);
  if (state.sort === 'score') items.sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
  if (state.sort === 'sector') {
    const groups = {};
    items.forEach(it => (groups[it.sector] ??= []).push(it));
    body = Object.entries(groups)
      .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], 'ko'))
      .map(([g, arr]) => `<tr class="group"><td colspan="5">${esc(g)} · ${arr.length}</td></tr>` +
        arr.sort((a, b) => b.days - a.days).map(row).join('')).join('');
  } else body = items.map(row).join('');

  const added = s.items.filter(it => it.days === 1);
  const chips = [];
  if (added.length) chips.push(`<div><span class="in">신규 편입 ${added.length}</span> ${added.map(a => esc(a.name)).join(', ')}</div>`);
  if (s.dropped.length) chips.push(`<div><span class="out">전일 대비 편출 ${s.dropped.length}</span> ${s.dropped.map(d => `${esc(d.name)} <span class="tag">${d.days}일 유지</span>`).join(', ')}</div>`);

  return `<section>
    <div class="sec-head"><h2>${idx + 1}. ${esc(s.title)}</h2>
      <span class="rule">${s.mas.map(m => m + '일선').join(' &gt; ')}</span>
      <span class="count">${q ? items.length + ' / ' : ''}${s.items.length}종목</span></div>
    ${chips.length ? `<div class="changes">${chips.join('')}</div>` : '<div style="height:12px"></div>'}
    ${items.length ? `<table><thead><tr><th>종목</th><th class="sector-col">섹터</th><th class="num">연속</th><th class="num" title="최근 2주 최저가~최고가 사이에서 오늘 종가가 어디쯤인지 (● 위치)">2주 위치</th><th class="num">추세강도</th><th class="num">시가총액</th></tr></thead>
      <tbody>${body}</tbody></table>` : '<div class="empty">해당 종목 없음</div>'}
  </section>`;
}

// 시장 체온계
function thermo(meta, ix) {
  const b = meta.breadth;
  if (!b) return '';
  const last = k => b[k][b[k].length - 1], ago = k => b[k][Math.max(0, b[k].length - 6)];
  const tile = (k, label) => {
    const v = last(k), d = v - ago(k);
    return `<div class="tile"><div class="k">${label}</div><div class="v">${v.toFixed(0)}%</div>
      <div class="d ${d > 0 ? 'ret-up' : d < 0 ? 'ret-dn' : 'tag'}">5일 ${d > 0 ? '+' : ''}${d.toFixed(1)}%p</div></div>`;
  };
  const s = last('short'), sd = s - ago('short');
  const mood = s >= 50 && sd >= 0 ? '🔥 추세 확산 — 정배열 신호를 적극적으로 볼 만한 국면'
    : s >= 50 ? '⚠️ 넓게 퍼졌지만 줄어드는 중 — 신규 진입은 신중하게'
    : sd > 0 ? '🌱 회복 중 — 정배열 종목이 늘어나는 초기'
    : '❄️ 약세 국면 — 정배열 종목이 적고 줄어드는 중';
  return `<section>
    <div class="sec-head"><h2>시장 체온계</h2><span class="count">${ix.name} 중 정배열 비율</span></div>
    <div class="mood">${mood}</div>
    <div class="tiles">${tile('short','단기 정배열')}${tile('mid','중기 정배열')}${tile('full','완전정배열')}</div>
    <div class="mini-chart"><canvas id="thermo"></canvas></div>
    <div class="legend"><span><i style="background:${COLORS[0]}"></i>단기</span><span><i style="background:${COLORS[1]}"></i>중기</span><span><i style="background:${COLORS[2]}"></i>완전정배열</span></div>
  </section>`;
}

function drawThermo(meta) {
  const el = document.getElementById('thermo');
  if (!el || !window.Chart || !meta.breadth) return;
  const b = meta.breadth;
  const ds = [['short','단기'],['mid','중기'],['full','완전정배열']].map(([k, l], i) => ({
    label: l, data: b[k], borderColor: COLORS[i], backgroundColor: COLORS[i], borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.2 }));
  charts.push(new Chart(el, { type: 'line', data: { labels: b.dates, datasets: ds },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: css('--tip-bg'), titleColor: css('--text'), bodyColor: css('--text'),
        borderColor: css('--line'), borderWidth: 1, callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y}%` } } },
      scales: { x: { ticks: { color: css('--muted'), maxTicksLimit: 4, maxRotation: 0 }, grid: { color: css('--grid') } },
                y: { min: 0, ticks: { color: css('--muted'), callback: v => v + '%' }, grid: { color: css('--grid') } } } } }));
}

// 신호 성적표
const pctS = v => v == null ? '<span class="tag">-</span>' : `<span class="${v > 0 ? 'ret-up' : v < 0 ? 'ret-dn' : ''}">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
const matchQ = it => { const q = state.q.trim().toLowerCase(); return !q || it.name.toLowerCase().includes(q) || (it.sector || '').toLowerCase().includes(q) || it.code.includes(q); };
let curSig = {}, curCheapOK = true, curRegime = null;
const sigBadge = code => { const v = curSig[code] || {};
  let b = '';
  if (v.u) b += v.g === 'C' ? '<span class="sb off" title="그날 켜진 규칙(등급 미달)">△</span>' : `<span class="sb up" title="그날 상승 초입 규칙 (${v.g}등급)">▲${v.g}</span>`;
  if (v.d) b += v.d === 'pull' ? '<span class="sb pull" title="그날 눌림 (60일선 상승 중)">▽눌림</span>' : '<span class="sb dn" title="그날 하락 경고 (60일선 꺾임)">▼경고</span>';
  return b; };
const wrSb = code => curWr[code] != null && curWr[code] <= -80 ? `<span class="sb wr" title="윌리엄스 %R(14일) ${curWr[code]} — 최근 2주 범위의 바닥권 (관찰용)${wrWarn ? ' · ' + wrWarn : ''}">◆%R${wrWarn ? ' ⚠' : ''}</span>` : '';
const hotTag = it => it.gap != null && it.gap >= OVERHEAT ? `<span class="badge hot" title="20일선 대비 +${it.gap}% — 이미 많이 올라 되밀림 위험이 큼">과열 +${Math.round(it.gap)}%</span>` : '';
const nameCell = it => `<a class="name" data-code="${it.code}" href="${fnguide(it.code)}" target="_blank" rel="noopener">${esc(it.name)}</a>${sigBadge(it.code)}`;
const alignTag = it => it.aligned && it.aligned.length
  ? `<span class="chip">${it.aligned.includes('mid') ? '중기' : ''}${it.aligned.length === 2 ? '·' : ''}${it.aligned.includes('short') ? '단기' : ''} 정배열</span>` : '';

// 지금 국면(약세장/강세장)에서 그 규칙들의 과거 성적을 신호 옆에 바로 보여 줌
function regimeInfo(meta) {
  const rn = meta.regime_now;
  const k = rn == null ? null : rn <= 20 ? 'cold' : rn >= 50 ? 'hot' : null;
  return k ? { k, label: k === 'cold' ? '약세장' : '강세장', rn, rules: Object.fromEntries((meta.rules || []).map(r => [r.id, r])) } : null;
}
function regimeTag(rules) {
  const R = curRegime; if (!R || !rules || !rules.length) return '';
  const vals = rules.map(r => R.rules[r] && R.rules[r].grade !== 'C' && R.rules[r][R.k] ? R.rules[r][R.k].excess : null).filter(v => v != null);
  if (!vals.length) return '';
  const v = Math.max(...vals);
  return `<span class="badge ${v < 0 ? 'hot' : 'val'}" title="지금 같은 ${R.label}에서 이 규칙의 과거 20일 성적(평균 대비, 가장 좋은 규칙 기준)">${R.label} 과거 ${pctS(v)}</span>`;
}
function regimeBanner() {
  const R = curRegime; if (!R) return '';
  const ab = Object.values(R.rules).filter(r => r.grade !== 'C' && r.id[0] === 'R' && r[R.k]);
  if (!ab.length) return '';
  const neg = ab.filter(r => r[R.k].excess < 0).length;
  return `<div class="alert ${R.k === 'cold' ? 'warn' : 'good'}"><b>${R.k === 'cold' ? '🧊' : '🔥'} 지금은 ${R.label} (단기 정배열 ${R.rn}%)</b>
    이 국면에서 검증 통과(A·B) 규칙 ${ab.length}개 중 <b>${neg}개가 과거 평균보다 못했습니다.</b> 각 신호 옆의 ‘${R.label} 과거 ±%’를 함께 보세요.</div>`;
}

function renderToday(data, meta) {
  if (!data.today) return `<section><div class="empty">새 데이터가 아직 없습니다. 데이터 갱신을 한 번 실행해 주세요.</div></section>`;
  const rules = Object.fromEntries((meta.rules || []).map(r => [r.id, r]));
  const all = data.today.filter(matchQ);
  const up = all.filter(x => x.u && x.g !== 'C'), weak = all.filter(x => x.u && x.g === 'C');
  const pull = all.filter(x => x.d === 'pull'), dn = all.filter(x => x.d === 'down');
  const chips = x => (x.u || []).map(r => rules[r] ? `<span class="chip ${rules[r].grade}" title="${esc(rules[r].desc)}">${esc(rules[r].name)}</span>` : '').join('');
  const gapS = g => g == null ? '-' : (g > 0 ? '+' : '') + g + '%';
  const table = (arr, withRules) => arr.length ? `<table><thead><tr><th>종목</th><th class="sector-col">섹터</th><th class="num">20일선 대비</th><th class="num sector-col">시가총액</th></tr></thead><tbody>
    ${arr.map(x => `<tr><td>${nameCell(x)}${x.u ? hotTag(x) : ''} ${alignTag(x)}${withRules && x.g !== 'C' ? regimeTag(x.u) : ''}${withRules ? '<br>' + chips(x) : ''}</td><td class="sector sector-col">${esc(x.sector)}</td>
      <td class="num">${gapS(x.gap)}</td><td class="num sector-col">${fmtCap(x.cap)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty" style="padding:10px 0">없음</div>';
  return `<section>
    <div class="sec-head"><h2>🔔 ${data.date} 장 마감 기준 신호</h2><span class="count">${all.length}종목</span></div>
    <div class="note" style="margin:6px 0 4px">이 날 <b>새로 신호가 뜬 종목만</b> 모았습니다. 신호는 장 마감 후 확정되므로 실제 대응은 <b>다음 거래일</b>입니다. 종목명을 누르면 차트와 손절선이 나옵니다.</div>
    ${regimeBanner()}
    <div class="sub-h"><span class="tri-up">▲ 상승 초입</span> — 검증 통과(A·B) 규칙 · ${up.length}</div>${table(up, true)}
    <div class="sub-h"><span class="tri-pull">▽ 눌림</span> — 정배열 종목이 꺾였지만 60일선은 상승 중 · ${pull.length}</div>${table(pull, false)}
    <div class="sub-h"><span class="tri-dn">▼ 하락 경고</span> — 정배열 종목이 꺾였고 60일선도 꺾임 · ${dn.length}</div>${table(dn, false)}

    ${weak.length ? `<details class="defs"><summary>△ 등급 미달 규칙이 켜진 종목 ${weak.length}개 보기 ▾</summary>${table(weak, true)}</details>` : ''}
    <div class="note" style="margin-top:10px">▽·▼는 자동 매도 신호가 아닙니다(성적표 ② 참고). 지금 시장 국면에 따라 규칙 성적이 달라지니 성적표 ⓪의 ‘지금 약세장/강세장’ 칸도 함께 보세요.</div>
  </section>`;
}

function renderCands(data, meta) {
  const rules = Object.fromEntries((meta.rules || []).map(r => [r.id, r]));
  const ok = g => state.gA ? g === 'A' : (g === 'A' || g === 'B');
  let items = (data.cands || []).filter(matchQ).filter(c => c.rules.some(r => rules[r] && ok(rules[r].grade)));
  const passed = (meta.rules || []).filter(r => ok(r.grade));
  return `${regimeBanner()}<section>
    <div class="sec-head"><h2>🎯 검증된 후보</h2><span class="count">${items.length}종목</span></div>
    <div class="note" style="margin:6px 0 10px">5년 데이터의 <b>앞 기간('22~'24)과 뒤 기간('25~'26) 모두에서</b> 시장 평균을 이긴 규칙이 최근 3거래일 안에 켜진 종목입니다. 성적은 다음 날 종가에 산 기준이라, <b>오늘·어제 켜진 종목</b>이 검증 조건에 가장 가깝습니다.
      <span class="g A">A</span> 두 기간 모두 + 통계적으로 확실 · <span class="g B">B</span> 두 기간 모두 +
      <label class="toggle"><input type="checkbox" id="gA" ${state.gA ? 'checked' : ''}> A등급만</label></div>
    ${passed.length ? '' : '<div class="empty">지금 데이터로는 통과한 규칙이 없습니다.</div>'}
    ${items.length ? `<table><thead><tr><th>종목 · 켜진 규칙</th><th class="sector-col">섹터</th><th class="num">이격도</th><th class="num">시가총액</th></tr></thead><tbody>
      ${items.map(it => `<tr><td>${nameCell(it)}${it.cheap && curCheapOK ? '<span class="badge val">저평가</span>' : ''} <span class="g ${it.best}">${it.best}</span>${hotTag(it)} <span class="tag">${it.ago === 0 ? '오늘' : it.ago === 1 ? '어제' : it.ago + '일 전'}</span>${regimeTag(it.rules)}<br>${it.rules.filter(r => rules[r] && ok(rules[r].grade)).map(r => `<span class="chip ${rules[r].grade}" title="${esc(rules[r].desc)}">${esc(rules[r].name)}</span>`).join('')}</td>
        <td class="sector sector-col">${esc(it.sector)}</td><td class="num">${it.gap == null ? '-' : (it.gap > 0 ? '+' : '') + it.gap + '%'}</td><td class="num">${fmtCap(it.cap)}</td></tr>`).join('')}
    </tbody></table>` : (passed.length ? '<div class="empty">오늘은 해당 종목 없음</div>' : '')}
    ${(meta.rules || []).length ? `<details class="defs"><summary>규칙과 등급 보기 ▾</summary>${meta.rules.map(r => `<div><span class="g ${r.grade}">${r.grade}</span> <b>${esc(r.name)}</b> — ${esc(r.desc)}</div>`).join('')}</details>` : ''}
  </section>`;
}

function renderValue(data, meta) {
  if (!data.has_value) return `<section><div class="empty">재무 데이터가 아직 없습니다.<br>데이터 갱신을 한 번 실행하면 생깁니다.</div></section>`;
  const rules = Object.fromEntries((meta.rules || []).map(r => [r.id, r]));
  const vr = ['V0','V1','V2','V3'].map(k => rules[k]).filter(Boolean);
  const all = (data.value || []).filter(matchQ);
  const items = state.vTrend ? all.filter(it => it.aligned.length || it.rules.length) : all;
  const num = (v, suf = '') => v == null ? '-' : v + suf;
  const ruleChips = it => it.rules.filter(r => rules[r] && rules[r].grade !== 'C').map(r => `<span class="chip ${rules[r].grade}" title="${esc(rules[r].desc)}">${esc(rules[r].name)}</span>`).join('');
  return `<section>
    <div class="sec-head"><h2>💎 저평가 종목</h2><span class="count">${items.length}종목</span></div>
    <div class="note" style="margin:6px 0 10px"><b>PER·PBR이 같은 업종 중간값보다 모두 낮고, ROE 5% 이상</b>인 종목입니다. 위에서부터 저평가 점수(싸고 수익성 좋은 정도, 100점 만점)가 높은 순입니다.
      PER·PBR은 <b>최근 결산 실적</b> 기준이라 증권사 앱의 숫자와 조금 다를 수 있습니다.
      싼 종목은 <b>싼 이유가 있는 경우가 많아</b>(가치 함정), 추세가 함께 돌아선 종목을 보는 게 좋습니다.
      <label class="toggle"><input type="checkbox" id="vT" ${state.vTrend ? 'checked' : ''}> 추세가 시작된 종목만 (정배열 또는 최근 규칙)</label></div>
    ${vr.length ? `<div class="rt-wrap"><table class="sc" style="margin-bottom:10px"><thead><tr><th>저평가 규칙 검증</th><th class="num">등급</th><th class="num">20일 평균 대비</th><th class="num">건수</th></tr></thead><tbody>
      ${vr.map(r => `<tr><td style="white-space:normal">${esc(r.name)}</td><td class="num"><span class="g ${r.grade}">${r.grade}</span></td><td class="num">${r.all ? pctS(r.all.excess) : '<span class="tag">데이터 부족</span>'}</td><td class="num">${r.all ? r.all.n : '-'}</td></tr>`).join('')}
    </tbody></table></div>` : ''}
    ${items.length ? `<table><thead><tr><th>종목 · 추세</th><th class="num">PER</th><th class="num">PBR</th><th class="num">ROE</th><th class="num sector-col">점수</th></tr></thead><tbody>
      ${items.map(it => `<tr><td>${nameCell(it)} <span class="tag">${esc(it.sector)}</span><br>${alignTag(it)}${ruleChips(it)}</td>
        <td class="num">${num(it.per)}${it.oneoff ? '<br><span class="chip w" title="PER이 아주 낮으면 일회성 이익일 수 있습니다">일회성?</span>' : ''}</td><td class="num">${num(it.pbr)}</td><td class="num">${num(it.roe, '%')}</td>
        <td class="num sector-col"><span class="score ${scoreCls(it.vs)}">${num(it.vs)}</span></td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">해당 종목 없음</div>'}
    <div class="note" style="margin-top:8px">※ 저평가 판단은 그날 이미 공개됐던 실적만 씁니다(12월 결산은 다음 해 4월부터 반영). 과거 재무가 약 3~4년치뿐이라 검증 기간은 정배열 규칙보다 짧습니다.</div>
  </section>`;
}

function renderEarly(data, meta) {
  const names = Object.fromEntries((meta.defs ? meta.defs.early : []).map(d => [d.id, d.name]));
  let items = (data.early || []).filter(matchQ);
  const total = items.length;
  if (state.e2) items = items.filter(it => it.escore >= 2);
  const dots = n => `<span class="dots">${'●'.repeat(n)}<span class="off">${'●'.repeat(4 - n)}</span></span>`;
  return `<section>
    <div class="sec-head"><h2>🚀 초입 후보</h2><span class="count">${items.length} / ${total}종목</span></div>
    <div class="note" style="margin:6px 0 10px">정배열이 완성되기 <b>전</b>에 나타나는 신호(최근 ${3}거래일). 신호가 겹칠수록 ●가 많습니다.
      <label class="toggle"><input type="checkbox" id="e2" ${state.e2 ? 'checked' : ''}> 신호 2개 이상만</label></div>
    ${items.length ? `<table><thead><tr><th>종목 · 켜진 신호</th><th class="sector-col">섹터</th><th class="num">초입</th><th class="num">상대강도</th><th class="num">시가총액</th></tr></thead><tbody>
      ${items.map(it => `<tr><td>${nameCell(it)}<br>${it.signals.map(x => `<span class="chip on">${x} ${names[x] || ''}</span>`).join('')}${alignTag(it)}</td>
        <td class="sector sector-col">${esc(it.sector)}</td><td class="num">${dots(it.escore)}</td>
        <td class="num">${it.rs ?? '-'}</td><td class="num">${fmtCap(it.cap)}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">해당 종목 없음</div>'}
    ${defsBlock(meta, 'early')}
  </section>`;
}

function renderExits(data, meta) {
  const names = Object.fromEntries((meta.defs ? meta.defs.exits : []).map(d => [d.id, d.name]));
  const items = (data.exits || []).filter(matchQ);
  return `<section>
    <div class="sec-head"><h2>📉 조정 중인 정배열 종목</h2><span class="count">${items.length}종목</span></div>
    <div class="note" style="margin:6px 0 10px">최근 5일 안에 정배열이었던 종목 중 꺾이기 시작한 것입니다.
      <b>5년 검증 결과, 이렇게 꺾였을 때 기계적으로 팔면 이후 반등해 오히려 손해인 경우가 많았습니다.</b> 매도 신호가 아니라 점검 목록으로 보세요. 중기 정배열이 유지된 채 꺾인 종목은 '눌림목' 규칙(R7·R8)으로 검증됩니다.</div>
    ${items.length ? `<table><thead><tr><th>종목 · 경보</th><th class="sector-col">섹터</th><th class="num">단계</th><th class="num">고점 대비</th><th class="num">시가총액</th></tr></thead><tbody>
      ${items.map(it => `<tr><td>${nameCell(it)}<br>${it.warns.map(w => `<span class="chip ${it.level >= 2 ? 'r' : 'w'}">${names[w] || w}${w === 'W1' && it.bigvol ? '·대량' : ''}</span>`).join('')}${it.aligned.length ? alignTag(it) : '<span class="chip">정배열 이탈</span>'}${it.up60 === undefined ? '' : it.up60 ? '<span class="chip" style="color:var(--notice-text)">▽ 60일선 상승 중(눌림 가능)</span>' : '<span class="chip r">▼ 60일선 꺾임</span>'}</td>
        <td class="sector sector-col">${esc(it.sector)}</td><td class="num"><span class="lvl ${it.level >= 2 ? 'l2' : 'l1'}">${it.level}</span></td>
        <td class="num">${pctS(it.dd)}</td><td class="num">${fmtCap(it.cap)}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">경보 없음</div>'}
    ${defsBlock(meta, 'exits')}
  </section>`;
}

function defsBlock(meta, key) {
  if (!meta.defs) return '';
  return `<details class="defs"><summary>신호 기준 보기 ▾</summary>${meta.defs[key].map(d => `<div><b>${d.id} ${esc(d.name)}</b> — ${esc(d.desc)}</div>`).join('')}</details>`;
}

function fwdTable(meta) {
  const f = meta.forward;
  if (!f) return '';
  const row = h => { const r = f.h[h]; return r && r.n ? `<td class="num">${pctS(r.excess)}<br><span class="tag">${r.beat}% · ${r.n}건</span></td>` : '<td class="num tag">아직<br>없음</td>'; };
  return `<div class="sub-h">⑤ 실전 기록 — ${f.since}부터 화면에 뜬 A·B 후보의 실제 성과</div>
    <div class="rt-wrap"><table class="sc"><thead><tr><th>기록</th><th class="num">5일 후</th><th class="num">10일 후</th><th class="num">20일 후</th></tr></thead>
    <tbody><tr><td><b>${f.logged}건</b> 기록</td>${row('5')}${row('10')}${row('20')}</tr></tbody></table></div>
    <div class="note">규칙을 만든 뒤의 '미래' 데이터라 가장 정직한 성적입니다. 평균 대비(아래: 시장을 이긴 비율·건수). 같은 날 같은 종목은 1건으로 셉니다. 최소 몇 달은 쌓여야 판단할 수 있습니다.</div>
    ${(f.items || []).length ? `<details class="defs"><summary>기록된 종목 보기 (최근 ${f.items.length}건) ▾</summary>
      <div class="rt-wrap"><table class="sc fwd-list"><thead><tr><th>날짜 · 종목</th><th class="num">진입가</th><th class="num">5일</th><th class="num">10일</th><th class="num">20일</th></tr></thead><tbody>
      ${f.items.map(it => { const cell = h => it['x' + h] != null ? pctS(it['x' + h]) : ''; const nowCell = it.now != null ? `${pctS(it.now)}<br><span class="tag">${it.days}일째</span>` : '<span class="tag">-</span>';
        const cells = [5, 10, 20].map(h => it['x' + h] != null ? `<td class="num">${cell(h)}</td>` : null);
        const k = cells.findIndex(x => x == null);
        if (k >= 0) { cells[k] = `<td class="num">${it.entry ? nowCell : '<span class="tag">내일부터</span>'}</td>`; for (let j = k + 1; j < 3; j++) cells[j] = '<td></td>'; }
        return `<tr><td>${it.date.slice(5)} <a class="name" data-code="${it.code}" href="${fnguide(it.code)}" target="_blank" rel="noopener">${esc(it.name)}</a> <span class="g ${it.grade}">${it.grade}</span><br><span class="tag">${it.rules.join('·')}</span></td>
          <td class="num">${it.entry ? Math.round(it.entry).toLocaleString() : '-'}</td>${cells.join('')}</tr>`; }).join('')}
      </tbody></table></div><div class="note">숫자는 같은 기간 구성종목 평균 대비. ‘N일째’는 아직 기간이 끝나지 않은 지금까지 성적입니다.</div></details>` : ''}`;
}

function wrTestTable(meta) {
  const T = meta.wr_test;
  if (!T) return '';
  const c = r => r ? `${pctS(r.excess)}<br><span class="tag">${r.beat}% · ${r.n}</span>` : '<span class="tag">-</span>';
  const rn = meta.regime_now, rk = rn == null ? null : rn <= 20 ? 'cold' : rn >= 50 ? 'hot' : null;
  const rlab = rk === 'cold' ? '약세장' : rk === 'hot' ? '강세장' : null;
  const base = T.find(r => r.id === 'WT0');
  const baseRev = T.find(r => r.id === 'WT7');
  const vs = r => { const bb = ['WT5', 'WT6'].includes(r.id) ? baseRev : base;
    return bb && bb.all && r.all && !['WT0', 'WT7'].includes(r.id) ? ` <span class="${r.all.excess > bb.all.excess ? 'ret-up' : 'ret-dn'}">(${r.all.excess > bb.all.excess ? '기준보다 ↑' : '기준보다 ↓'})</span>` : ''; };
  const NM = { WT0: '중기 정배열 종목 (아무 때나, 비교 기준)', WT1: '정배열 + 2주 저점 근처로 내려온 날', WT2: '정배열 + 2주 저점 근처에서 벗어난 날', WT3: '정배열 + 2주 고점 근처로 올라온 날', WT4: '정배열 + 2주 고점 근처에서 내려온 날',
    WT7: '역배열 종목 (아무 때나, 비교 기준)', WT5: '역배열 + 2주 저점 근처로 내려온 날', WT6: '역배열 + 2주 저점 근처에서 벗어난 날 (반등 시작)' };
  const ORDER = ['WT0', 'WT1', 'WT2', 'WT3', 'WT4', 'WT7', 'WT5', 'WT6'];
  T.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
  T.forEach(r => { if (NM[r.id]) r.name = NM[r.id]; });
  return `<div class="sub-h">⑥-1 ‘2주 위치’(윌리엄스 %R) 5년 검증 — 20일 뒤 평균 대비</div>
    <div class="rt-wrap"><table class="sc rt"><thead><tr><th>조건</th><th class="num">등급</th><th class="num">전체</th><th class="num y1">앞 기간</th><th class="num y1">뒤 기간</th>${rlab ? `<th class="num">지금<br>${rlab}</th>` : ''}</tr></thead><tbody>
    ${T.map(r => `<tr><td style="white-space:normal" title="${esc(r.desc)}">${esc(r.name)}${vs(r)}</td><td class="num"><span class="g ${r.grade}">${r.grade}</span></td>
      <td class="num">${c(r.all)}</td><td class="num y1">${c(r.train)}</td><td class="num y1">${c(r.test)}</td>${rk ? `<td class="num">${c(r[rk])}</td>` : ''}</tr>`).join('')}
    </tbody></table></div>
    <div class="note">‘2주 저점 근처’ = 2주 범위의 하위 20%(%R −80 이하), ‘2주 고점 근처’ = 상위 20%(%R −20 이상). 이 경계를 지나는 날을 지난 5년치 고가·저가로 검증한 결과입니다(기존 규칙·후보·등급과 무관한 관찰용). 정배열 줄은 ‘정배열 아무 때나’, 역배열 줄은 ‘역배열 아무 때나’보다 확실히 높아야 그 위치가 의미 있다고 볼 수 있습니다. 역배열 = 20일선 < 60일선 < 120일선(하락 추세).
      등급 기준은 위 규칙과 같습니다(앞·뒤 기간 모두 비용 0.3%보다 높고 t값 충분). 지금 구성종목으로 과거를 계산해 실제보다 좋게 나올 수 있습니다.</div>`;
}

function wrTable(meta) {
  const f = meta.forward_wr;
  if (!f) return '';
  const cell = r => r && r.n ? `<td class="num">${pctS(r.excess)}<br><span class="tag">${r.beat}% · ${r.n}건</span></td>` : '<td class="num tag">아직<br>없음</td>';
  const tr = (label, g) => `<tr><td>${label}</td>${['5', '10', '20'].map(h => cell(f.h[g][h])).join('')}</tr>`;
  return `<div class="sub-h">⑥ 관찰 — 정배열 + %R 눌림 (${f.since.slice(5)}~)</div>
    <div class="rt-wrap"><table class="sc"><thead><tr><th>그룹</th><th class="num">5일 후</th><th class="num">10일 후</th><th class="num">20일 후</th></tr></thead>
    <tbody>${tr('중기 정배열 전체', 'base')}${tr(`+ %R ${f.pull} 이하 진입<br><span class="tag">${f.events}건</span>`, 'pull')}</tbody></table></div>
    <div class="note">래리 윌리엄스 %R(${f.n}일)을 추세 속 눌림목 판단에 쓸 만한지 보는 관찰입니다. 기존 규칙·등급에는 반영하지 않습니다. 아래 줄이 위 줄보다 꾸준히 높아야 의미가 있고, 최소 2~3개월은 쌓여야 판단할 수 있습니다. (평균 대비, 다음 날 종가 진입, 같은 종목은 20거래일에 1번)</div>
    ${(f.items || []).length ? `<details class="defs"><summary>눌림 진입 종목 보기 (최근 ${f.items.length}건) ▾</summary>
      <div class="rt-wrap"><table class="sc"><thead><tr><th>날짜 · 종목</th><th class="num">%R</th></tr></thead><tbody>
      ${f.items.map(it => `<tr><td>${it.date.slice(5)} <a class="name" data-code="${it.code}" href="${fnguide(it.code)}" target="_blank" rel="noopener">${esc(it.name)}</a></td><td class="num">${it.wr}</td></tr>`).join('')}
      </tbody></table></div></details>` : ''}`;
}

function rulesTable(meta) {
  if (!meta.rules) return '';
  const c = r => r ? `${pctS(r.excess)}<br><span class="tag">${r.beat}% · ${r.n}</span>` : '<span class="tag">-</span>';
  const rn = meta.regime_now, rk = rn == null ? null : rn <= 20 ? 'cold' : rn >= 50 ? 'hot' : null;
  const rlab = rk === 'cold' ? '약세장' : rk === 'hot' ? '강세장' : null;
  const regCell = r => { if (!rk) return ''; const x = r[rk]; return `<td class="num">${x ? `${pctS(x.excess)}<br><span class="tag">${x.n}건</span>` : '<span class="tag">-</span>'}</td>`; };
  return `${rlab ? `<div class="note" style="margin:8px 0">지금은 <b>${rlab}</b>입니다(단기 정배열 비율 ${rn}%). ‘${rlab}’ 칸이 지금 같은 국면에서 각 규칙의 과거 성적입니다.</div>` : ''}<div class="sub-h">⓪ 조합 규칙 — 20일 평균 대비 (아래: 시장을 이긴 비율 · 건수)</div>
    <div class="rt-wrap"><table class="sc"><thead><tr><th>규칙</th><th class="num">등급</th><th class="num">전체</th><th class="num">앞 기간<br>'22~'24</th><th class="num">뒤 기간<br>'25~'26</th><th class="num">사흘<br>늦게</th>${rlab ? `<th class="num">지금<br>${rlab}</th>` : ''}</tr></thead><tbody>
    ${meta.rules.map(r => `<tr><td style="white-space:normal;min-width:130px"><b>${r.id}</b> ${esc(r.name)}</td><td class="num"><span class="g ${r.grade}">${r.grade}</span>${r.held ? '<br><span class="tag" title="기준선 근처라 어제 등급을 유지">유지</span>' : ''}</td>
      <td class="num">${c(r.all)}${r.all && r.all.t != null ? `<br><span class="tag">t ${r.all.t}</span>` : ''}</td><td class="num">${c(r.train)}</td><td class="num">${c(r.test)}</td><td class="num">${r.late ? pctS(r.late.excess) : '-'}</td>${regCell(r)}</tr>`).join('')}
    </tbody></table></div>
    <div class="note">등급: 앞·뒤 기간 모두 매매비용(${meta.cost ?? 0.3}%)보다 크게 이겼으면 B, 거기에 통계적으로도 확실(t 2.5 이상)하면 A.
      기준선 근처에서는 등급이 날마다 바뀌지 않도록 어제 등급을 유지합니다(‘유지’ 표시).
      ‘사흘 늦게’는 신호를 보고 사흘 뒤에 샀을 때입니다 — 이 값이 크게 줄면 빨리 사야 하는 신호입니다.
      ※ 이 규칙들은 5년 결과를 보고 고른 것이라 뒤 기간도 완전히 새로운 데이터는 아닙니다. 진짜 검증은 아래 ‘⑤ 실전 기록’입니다.</div>`;
}

function scoreTable(meta) {
  const sc = meta.scorecard;
  if (!sc || !sc.entries) return '';
  const mark = r => r && r.sig ? (r.excess > 0 ? ' <span title="우연으로 보기 어려운 차이">✅</span>' : ' <span title="우연으로 보기 어려운 차이(나쁜 쪽)">⚠️</span>') : '';
  const ent = sc.entries.filter(e => ['short', 'mid', 'C'].includes(e.id)).map(e => {
    const c = h => { const r = e.h[h]; return r ? `<td class="num">${pctS(r.excess)}${mark(r)}<br><span class="tag">${r.win}% · ${r.n}건</span></td>` : '<td class="num tag">-</td>'; };
    const g = r => r ? `${pctS(r.excess)}${mark(r)}<span class="tag">(${r.n})</span>` : '<span class="tag">-</span>';
    const early = !['short','mid'].includes(e.id);
    const yrs = Object.entries(e.years || {}).map(([y, v]) => `<span class="yr">'${y.slice(2)} ${pctS(v.excess)}</span>`).join('');
    return `<tr${early ? '' : ' class="base"'}><td><b>${esc(e.name)}</b></td>${c('5').replace('<td class="num','<td class="h5 num')}${c('10')}${c('20')}<td class="num">${g(e.hot)}<br>${g(e.cold)}</td></tr>
      ${yrs ? `<tr class="yrs"><td colspan="5">연도별 20일: ${yrs}</td></tr>` : ''}`;
  }).join('');
  const ex = sc.exits.map(e => e.n ? `<tr><td><b>${esc(e.name)}</b></td><td class="num">${e.n}</td>
      <td class="num">${pctS(e.ret20)}${e.sig ? (e.t < 0 ? ' ✅' : ' ⚠️') : ''}</td><td class="num">${pctS(e.ctrl20)}</td><td class="num">${pctS(e.dd20)}</td></tr>`
    : `<tr><td><b>${esc(e.name)}</b></td><td class="num tag" colspan="4">사례 없음</td></tr>`).join('');
  const mk = sc.market.filter(e => e.id !== 'crash').map(e => `<tr><td><b>${esc(e.name)}</b></td><td class="num">${e.n}</td><td class="num">${pctS(e.ret20)}</td><td class="num">${pctS(e.all20)}</td></tr>`).join('');
  return `<section><details>
    <summary><div class="sec-head"><h2>신호 성적표</h2><span class="count">어떤 신호가 실제로 맞았나</span></div></summary>
    <div class="note" style="margin:10px 0"><b>${sc.from} ~ ${sc.to || ''}</b>, 신호가 켜진 <b>다음 날 종가</b>에 샀다고 가정했습니다(신호는 장 마감 후에야 알 수 있으므로). 같은 종목의 같은 신호는 20거래일에 한 번만 셉니다. 가격은 네이버 통합 시세(정규장 + 넥스트레이드 애프터마켓, 오후 8시 확정)라 증권사 앱의 15:30 종가와 조금 다를 수 있습니다.
      <b>평균 대비</b>가 +면 같은 기간 구성종목 평균보다 나았다는 뜻입니다. 지금의 구성종목으로 계산해 실제보다 조금 좋게 나올 수 있고, 수수료·세금은 빠져 있습니다.<br>
      <b>✅ = 우연으로 보기 어려운 차이</b>(같은 달 신호끼리 묶어 계산한 t값 2 이상, 12개월 이상). ✅가 없는 숫자는 운일 수 있습니다. ⚠️는 반대로 확실히 나빴다는 뜻입니다.
      연도별 숫자가 해마다 같은 방향이면 믿을 만한 신호입니다.</div>
    ${rulesTable(meta)}

// 오늘 기준으로 이미 나와 있어야 할 최신 거래일 (평일 20:05 이후면 오늘, 아니면 직전 평일; 공휴일은 모름)
function expectedDate() {
  const k = new Date(Date.now() + 9 * 3600e3);
  const mins = k.getUTCHours() * 60 + k.getUTCMinutes();
  let d = new Date(Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate()));
  const wk = x => x.getUTCDay() >= 1 && x.getUTCDay() <= 5;
  if (!(wk(d) && mins >= 20 * 60 + 5)) { do { d = new Date(d - 864e5); } while (!wk(d)); }
  return d.toISOString().slice(0, 10);
}

    if (cur == null) return `<tr><td>${esc(h.name)}</td><td colspan="3" class="tag">지금 ${ix.name} 구성종목이 아니어서 가격을 받을 수 없습니다</td></tr>`;
    const ret = (cur / h.buy - 1) * 100, dist = (cur / h.stop - 1) * 100;
    const sig = curSig[h.code] || {};
    const flags = [cur <= h.stop ? '<span class="sb dn">손절선 이탈</span>' : dist < 5 ? '<span class="sb pull">손절선 근접</span>' : '',
      st.m20 && cur < st.m20 ? '<span class="sb off">20일선 아래</span>' : '',
      sig.d === 'down' ? '<span class="sb dn">▼경고</span>' : sig.d === 'pull' ? '<span class="sb pull">▽눌림</span>' : ''].join('');
    const lamp = cur <= h.stop ? '🔴' : dist < 5 ? '🟡' : '🟢';
    return `<tr><td>${lamp} <a class="name" data-code="${h.code}" href="${fnguide(h.code)}" target="_blank" rel="noopener">${esc(h.name)}</a>${flags}<br><span class="tag">${h.date.slice(5)} 매수 ${fmt(h.buy)} · 손절 ${fmt(h.stop)}</span></td>
      <td class="num">${fmt(cur)}</td><td class="num">${pctS(ret)}</td><td class="num">${cur <= h.stop ? '<b class="ret-dn">이탈</b>' : '+' + dist.toFixed(1) + '%'}</td></tr>`;
  }).join('');
  const broken = mine.some(h => { const st = cd.stocks[h.code]; const cs = st ? st.c.filter(v => v != null) : []; return cs.length && cs[cs.length - 1] <= h.stop; });
  el.innerHTML = `<section class="hold"><div class="sec-head"><h2>💼 내 종목</h2><span class="count">${mine.length}종목 · ${cd.dates ? cd.dates[cd.dates.length - 1] : ''} 종가 기준</span></div>
    ${broken ? '<div class="alert danger"><b>🔴 손절선을 넘은 종목이 있습니다.</b>미리 정한 규칙대로라면 정리할 시점입니다.</div>' : ''}
    <table><thead><tr><th>종목</th><th class="num">현재가</th><th class="num">수익률</th><th class="num">손절선까지</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="note">이 기기 브라우저에만 저장됩니다. 수정·해제는 종목명을 눌러 차트 아래에서 하세요.</div></section>`;
}

// 손절선 계산기: 틀렸을 때 얼마에 나올지 먼저 정하기
function stopBox(st, last, fmtP) {
  if (!last) return '';
  const lv = [];
  if (st.dv) lv.push(['출렁임 기준', `최근 하루 평균 변동 ${st.dv}%의 3배`, Math.min(st.dv * 3, 30)]);
  if (st.m20) lv.push(['20일선 이탈', `20일선 ${fmtP(st.m20)}원`, (1 - st.m20 / last) * 100]);
  lv.push(['고정 비율', '산 가격 대비 −8%', 8]);
  const rows = lv.map(([n, d, pct]) => pct <= 0
    ? `<tr><td><b>${n}</b><br><span class="tag">${d}</span></td><td class="num" colspan="2"><span class="tag">이미 20일선 아래</span></td></tr>`
    : `<tr><td><b>${n}</b><br><span class="tag">${d}</span></td><td class="num">${fmtP(last * (1 - pct / 100))}원<br><span class="ret-dn">−${pct.toFixed(1)}%</span></td>
       <td class="num">${Math.min(100, 1 / pct * 100).toFixed(0)}%</td></tr>`).join('');
  return `<div class="sub-h">🛡️ 손절선 계산 (오늘 종가 ${fmtP(last)}원에 산다면)</div>
    <table class="mk"><thead><tr><th style="width:auto">기준</th><th class="num" style="width:96px">손절 가격</th><th class="num" style="width:84px">최대 비중*</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="note">* 손절했을 때 <b>전체 투자금의 1%만</b> 잃도록 하려면 이 종목에 넣을 수 있는 최대 비중입니다(1% ÷ 손절 폭). 손절 폭이 좁으면 너무 쉽게 털리고, 넓으면 비중을 줄여야 합니다.
      출렁임 기준보다 좁은 손절선은 평소 흔들림에도 걸리기 쉽습니다.</div>`;
}
function dnNote(meta) {
  const ex = ((meta.scorecard || {}).exits || []);
  const f = id => ex.find(e => e.id === id);
  const p = f('L2p'), d = f('L2d');
  const line = (e, label) => e && e.n ? `${label}: 경보 뒤 20일 ${pctS(e.ret20)} (경보 없는 정배열 종목 ${pctS(e.ctrl20)})` : '';
  return `⚠️ ▼·▽는 <b>자동 매도 신호가 아닙니다.</b> 5년 검증 — ${[line(p, '▽ 눌림'), line(d, '▼ 하락 경고')].filter(Boolean).join(' · ') || '데이터 없음'}.
    손실을 줄이는 데는 위 <b>손절선</b>을 미리 정해 두는 쪽이 더 확실합니다.`;
}

// ---------------------------------------------------------- 종목 차트 (▲ 상승 초입 · ▼ 하락 초입)
async function openChart(ixId, code) {
  const ix = INDEX[ixId];
  let cd, meta;
  try { [cd, meta] = await Promise.all([getJSON(ix.dir + 'charts.json'), getJSON(ix.dir + 'dates.json')]); }
  catch { alertBox('차트 데이터가 아직 없습니다. 데이터 갱신을 한 번 실행해 주세요.'); return; }
  const st = cd.stocks[code];
  if (!st) { alertBox('이 종목의 차트 데이터가 없습니다.'); return; }
  const rname = Object.fromEntries((meta.rules || []).map(r => [r.id, r.name]));
  const wname = Object.fromEntries(((meta.defs || {}).exits || []).map(d => [d.id, d.name]));
  const G = cd.grades || {}, rank = { A: 0, B: 1, C: 2 };
  const best = rs => rs.map(r => G[r] || 'C').sort((a, b) => rank[a] - rank[b])[0];
  const c = st.c, P = cd.pad, N = c.length;
  const ma = n => c.map((_, i) => { if (i < n - 1) return null; let s = 0; for (let k = i - n + 1; k <= i; k++) { if (c[k] == null) return null; s += c[k]; } return s / n; });
  const m20 = ma(20), m60 = ma(60);
  const lastClose = (() => { for (let i = N - 1; i >= 0; i--) if (c[i] != null) return c[i]; })();
  // 결과: 다음 날 종가에 샀다고 보고 20일 뒤(아직 안 됐으면 오늘)까지
  const after = i => { const j0 = i + 1; if (j0 >= N || c[j0] == null) return null; const j1 = Math.min(N - 1, j0 + 20);
    return { r: (c[j1] / c[j0] - 1) * 100, d: j1 - j0 }; };
  const marks = [...st.b.map(([i, rs]) => ({ i, up: true, rs, g: best(rs) })), ...st.x.map(([i, ws, k]) => ({ i, up: false, ws, k: k || 'down' }))]
    .sort((a, b) => b.i - a.i);
  const sl = a => a.slice(P);
  const labels = sl(cd.dates).map(d => d.slice(5));
  const pts = (up, g) => { const arr = new Array(N).fill(null);
    marks.filter(m => m.up === up && (up ? (g === 'C' ? m.g === 'C' : m.g !== 'C') : m.k === g)).forEach(m => { if (c[m.i] != null) arr[m.i] = c[m.i] * (up ? 0.96 : 1.04); });
    return sl(arr); };
  const upC = css('--up'), dnC = css('--dn'), mut = css('--muted');
  const fmtP = v => v == null ? '-' : v >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(2);
  const rows = marks.filter(m => m.i >= P).map(m => {
    const a = after(m.i);
    const res = a ? `${pctS(a.r)}<br><span class="tag">${a.d}일 ${a.d < 20 ? '(진행 중)' : '후'}</span>` : '<span class="tag">내일부터</span>';
    const what = m.up
      ? `<span class="${m.g === 'C' ? 'tri-off' : 'tri-up'}">▲ 상승 초입</span> ${m.rs.map(r => `<span class="chip ${G[r] || 'C'}">${r} ${esc(rname[r] || '')} · ${G[r] || 'C'}</span>`).join('')}`
      : (m.k === 'pull' ? `<span class="tri-pull">▽ 눌림</span> ` : `<span class="tri-dn">▼ 하락 경고</span> `) + `${m.ws.map(w => `<span class="chip r">${esc(wname[w] || w)}</span>`).join('')}`;
    return `<tr><td class="num" style="vertical-align:top">${cd.dates[m.i].slice(2)}</td><td>${what}</td><td class="num">${res}</td></tr>`;
  }).join('');
  const box = document.createElement('div');
  box.className = 'modal';
  box.innerHTML = `<div class="box" role="dialog" aria-label="${esc(st.n)} 차트">
    <div class="top"><h2>${esc(st.n)}</h2>${curWr[code] != null ? `<span class="badge" title="최근 2주 최저가를 0, 최고가를 100으로 놓았을 때 오늘 종가 위치">2주 ${wrLabel(curWr[code])} (${wrPos(curWr[code])}/100)</span>` : ''}<span class="tag">${code} · ${fmtP(lastClose)}원${st.v ? ` · PER ${st.v[0] ?? '-'} · PBR ${st.v[1] ?? '-'} · ROE ${st.v[2] ?? '-'}%` : ''}</span>${st.v && st.v[3] && curCheapOK ? '<span class="badge val">저평가</span>' : ''}${st.v && st.v[0] != null && st.v[0] < 4 ? '<span class="badge hot" title="PER이 아주 낮으면 자산 매각 등 일회성 이익일 수 있습니다">일회성 이익?</span>' : ''}
      <button class="x" type="button">닫기</button></div>
    <div class="legend" style="margin-top:8px">
      <span><span class="tri-up">▲</span> 상승 초입 (A·B등급 규칙)</span><span><span class="tri-off">△</span> 등급 미달 규칙</span>
      <span><span class="tri-dn">▼</span> 하락 경고 (60일선 꺾임)</span><span><span class="tri-pull">▽</span> 눌림 (60일선 상승 중)</span>
      <span><i style="background:${COLORS[1]}"></i>20일선</span><span><i style="background:${COLORS[3]}"></i>60일선</span></div>
    <div class="stock-chart"><canvas id="sc"></canvas></div>
    <div class="note">신호는 장 마감 후 확정되므로 <b>표시된 날 다음 날</b>이 실제 진입·대응 시점입니다. 수익은 다음 날 종가 기준입니다. 차트 가격은 오후 8시 확정 통합 시세입니다.</div>
    ${rows ? `<table class="mk" style="margin-top:8px"><thead><tr><th class="num">날짜</th><th>신호</th><th class="num">이후 수익</th></tr></thead><tbody>${rows}</tbody></table>`
           : '<div class="empty">최근 6개월 동안 신호가 없었습니다.</div>'}
    ${stopBox(st, lastClose, fmtP)}
    ${holdForm(ixId, code, st.n, lastClose, st, cd.dates[cd.dates.length - 1], fmtP)}
    <div class="note" style="margin-top:10px">${dnNote(meta)}</div>
    <div style="margin-top:12px"><a class="name" href="${fnguide(code)}" target="_blank" rel="noopener">FnGuide 기업정보 열기 ↗</a></div>
  </div>`;
  document.body.appendChild(box);
  bindHoldForm(box);
  let chart;
  const close = () => { if (chart) chart.destroy(); box.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  box.onclick = e => { if (e.target === box || e.target.closest('.x')) close(); };
  if (!window.Chart) return;
  const mk = (label, data, color, style, rot, fill) => ({ type: 'line', label, data, showLine: false, pointStyle: style, rotation: rot,
    pointRadius: 7, pointHoverRadius: 9, borderColor: color, backgroundColor: fill ? color : 'transparent', borderWidth: 2, order: 0 });
  chart = new Chart(box.querySelector('#sc'), { type: 'line',
    data: { labels, datasets: [
      { label: '종가', data: sl(c), borderColor: css('--text'), backgroundColor: css('--text'), borderWidth: 1.6, pointRadius: 0, pointHoverRadius: 3, tension: 0.1, order: 2, spanGaps: true },
      { label: '20일선', data: sl(m20), borderColor: COLORS[1], borderWidth: 1.4, pointRadius: 0, pointHoverRadius: 0, order: 3 },
      { label: '60일선', data: sl(m60), borderColor: COLORS[3], borderWidth: 1.4, pointRadius: 0, pointHoverRadius: 0, order: 3 },
      mk('▲ 상승 초입', pts(true, 'AB'), upC, 'triangle', 0, true),
      mk('△ 등급 미달', pts(true, 'C'), mut, 'triangle', 0, false),
      mk('▼ 하락 경고', pts(false, 'down'), dnC, 'triangle', 180, true),
      mk('▽ 눌림', pts(false, 'pull'), css('--notice-text'), 'triangle', 180, false),
    ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: css('--tip-bg'), titleColor: css('--text'), bodyColor: css('--text'),
        borderColor: css('--line'), borderWidth: 1,
        filter: it => it.raw != null && !(it.datasetIndex >= 3 && it.raw == null),
        callbacks: { label: it => {
          const i = it.dataIndex + P;
          if (it.datasetIndex === 0) return ` 종가 ${fmtP(it.raw)}`;
          if (it.datasetIndex < 3) return ` ${it.dataset.label} ${fmtP(it.raw)}`;
          const m = marks.find(x => x.i === i && x.up === (it.datasetIndex < 5));
          if (!m) return '';
          return m.up ? ` ▲ ${m.rs.map(r => `${r}(${G[r] || 'C'})`).join(', ')}` : ` ${m.k === 'pull' ? '▽ 눌림' : '▼ 하락 경고'}: ${m.ws.map(w => wname[w] || w).join(', ')}`;
        } } } },
      scales: { x: { ticks: { color: css('--muted'), maxTicksLimit: 6, maxRotation: 0 }, grid: { color: css('--grid') } },
                y: { ticks: { color: css('--muted'), callback: v => fmtP(v) }, grid: { color: css('--grid') } } } } });
}
function alertBox(msg) {
  const b = document.createElement('div'); b.className = 'modal';
  b.innerHTML = `<div class="box"><div class="empty">${esc(msg)}</div><button class="x" type="button">닫기</button></div>`;
  b.onclick = e => { if (e.target === b || e.target.closest('.x')) b.remove(); };
  document.body.appendChild(b);
}
document.addEventListener('click', e => {
  const a = e.target.closest('a.name[data-code]');
  if (!a || !INDEX[state.tab] || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  openChart(state.tab, a.dataset.code);
});

// ---------------------------------------------------------- 공통
async function render() {
  charts.forEach(c => c.destroy()); charts = [];
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  try {
    if (INDEX[state.tab]) await renderAlignment(state.tab);
    else if (state.tab === 'sector') await renderSector();
    else await renderTrend(state.tab);
  } catch (e) {
    panel().innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.</div>';
  }
}

async function header() {
  const parts = [];
  for (const [k, v] of Object.entries(INDEX)) {
    try { const m = await getJSON(v.dir + 'dates.json'); parts.push(`${v.name} ${fmtTime(m.updated)}`); } catch {}
  }
  for (const [k, v] of [['us','미국'],['kr','국내 ETF']]) {
    try { const m = await getJSON(`data/${k}_trend.json`); parts.unshift(`${v} ${fmtTime(m.updated)}`); } catch {}
  }
  document.getElementById('updated').textContent = parts.length ? '마지막 업데이트 — ' + parts.join(' / ') : '데이터 없음';
}

document.getElementById('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  state.tab = b.dataset.tab;
  try { history.replaceState(null, '', '#' + state.tab); } catch {}
  render();
};

document.getElementById('theme').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', theme); } catch {}
  applyTheme(theme); render();
};
applyTheme(theme);
const fromHash = location.hash.slice(1);
if (document.querySelector(`#tabs button[data-tab="${fromHash}"]`)) state.tab = fromHash;
header();
render();
</script>
</body>

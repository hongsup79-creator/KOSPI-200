        <div class="cfn">‘매도가 끝나고 돌아섰다’는 확인 신호입니다. 그래도 한 번에 사지 말고 나눠서, 손절선을 먼저 정하세요. 과거 성적은 🌡️ 바닥·고점 탭에서 확인하세요.</div></div>`
    : `<div class="confirm" data-go="gauge"><b>⏳ 바닥 확인 신호 대기 중</b> <span class="tag">(VIX는 ${VX ? VX.date.slice(5).replace('-', '/') : k.to.slice(5)} 미국 종가 기준)</span>
        <div class="cfn">${vixProg}${vixProg && brProg ? '<br>' : ''}${brProg}</div></div>`;
  el.querySelector('.confirm').onclick = () => { if (state.tab !== 'gauge') { state.tab = 'gauge'; location.hash = 'gauge'; render(); } };
}

// ---------------------------------------------------------- 🏠 오늘 요약 (한 화면에 결론만)
async function renderHome() {
  const tryJ = async u => { try { return await getJSON(u); } catch { return null; } };
  const [g, us, kr] = await Promise.all([tryJ('data/market_gauge.json'), tryJ('data/us_trend.json'), tryJ('data/kr_trend.json')]);
  const ix = {};
  for (const [k, v] of Object.entries(INDEX)) {
    const meta = await tryJ(v.dir + 'dates.json'); if (!meta) continue;
    ix[k] = { meta, data: await tryJ(v.dir + meta.dates[0] + '.json') };
  }
  if (state.tab !== 'home') return;
  const pc = v => v == null ? '-' : `<span class="${v > 0 ? 'ret-up' : v < 0 ? 'ret-dn' : ''}">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
  const chg = (trend, name) => { if (!trend) return null; for (const gr of trend.groups) for (const se of gr.series) if (se.name === name) {
      const c = se.close.filter(x => x != null); return c.length > 1 ? { last: c[c.length - 1], d: (c[c.length - 1] / c[c.length - 2] - 1) * 100 } : null; } return null; };
  // 1) 오늘의 결론
  const K = g && (g.markets.find(m => m.id === 'KOSPI') || g.markets[0]);
  const T = K ? Object.fromEntries(K.tests.map(t => [t.id, t])) : {};
  const ok = id => T[id] && gaugeJudge(T[id])[0] === 'ok';
  const br = Object.entries(ix).map(([k, v]) => { const b = v.meta.breadth; const sh = b && b.short; return { k, name: INDEX[k].name, now: sh ? sh[sh.length - 1] : null, d5: sh && sh.length > 5 ? sh[sh.length - 1] - sh[sh.length - 6] : null }; });
  const cold = br.some(b => b.now != null && b.now <= 20);
  const stage1 = K && ((K.now.gap != null && K.now.gap <= -10) || (K.now.dd != null && K.now.dd <= -20));
  const stage2 = ok('vix_turn') && T.vix_turn.active;
  const hot = ['gap_hi', 'vix_calm', 'br_dn'].some(id => ok(id) && T[id].active);
  let cls, head, advice;
  if (stage2) { cls = 'good'; head = '✅ 바닥 확인 신호가 켜졌습니다'; advice = '매도가 끝나고 돌아섰다는 신호입니다. <b>나눠서</b> 사는 것을 검토할 수 있는 구간입니다. 사기 전에 손절선부터 정하세요.'; }
  else if (stage1 || cold) { cls = 'cold'; head = '🧊 지금은 관찰 구간입니다'; advice = '시장이 많이 빠져 있지만, 돌아섰다는 확인은 아직 없습니다. <b>새로 사기보다 지켜보고</b>, 가진 종목은 손절선을 점검할 때입니다.'; }
  else if (hot) { cls = 'hot'; head = '🔥 과열 주의'; advice = '과거에 맞았던 고점 경고가 켜져 있습니다. 새로 살 때 비중을 줄이고 손절선을 꼭 정하세요.'; }
  else { cls = 'mid'; head = '🙂 평소 구간입니다'; advice = '검증된(A·B) 신호 위주로, 과열 배지가 없는 종목만 보세요.'; }
  const why = [];
  if (K && K.now.dd != null) why.push(`코스피 1년 최고가 대비 <b>${K.now.dd}%</b>${K.now.dd <= -20 ? ' (많이 빠짐)' : ''}`);
  br.forEach(b => b.now != null && why.push(`${b.name} 체온계 <b>${b.now}%</b>${b.now <= 20 ? ' (약세장)' : b.now >= 50 ? ' (강세장)' : ''}${b.d5 != null ? ` · 5일 ${b.d5 > 0 ? '+' : ''}${b.d5.toFixed(1)}%p` : ''}`));
  const VX = vixLatest(us);
  if (VX) why.push(`VIX 공포지수 <b>${VX.now}</b> (어젯밤 미국) — ${stage2 ? '공포 정점을 지나 꺾임' : VX.max10 >= 30 ? `공포 급등 중 (최근 최고 ${VX.max10}). 최고점에서 20% 꺾이면 확인 신호` : VX.now >= 25 ? '불안이 커지는 중. 30을 넘었다가 꺾이면 확인 신호' : '아직 공포 급등 없음'}`);
  // 2) 어제 시장
  const mk = [['코스피', chg(kr, '코스피')], ['코스닥', chg(kr, '코스닥')]];
  const usk = [['S&P 500', chg(us, 'S&P500')], ['나스닥', chg(us, '나스닥 종합')], ['반도체', chg(us, '필라델피아 반도체')], ['VIX', chg(us, 'VIX 공포지수')]];
  const usDate = us ? us.dates[us.dates.length - 1].slice(5).replace('-', '/') : '';
  const krDate = ix.kospi200 ? ix.kospi200.meta.dates[0].slice(5).replace('-', '/') : '';
  const fmtV = v => v.last >= 1000 ? Math.round(v.last).toLocaleString() : v.last.toFixed(2);
  const tick = ([n, v], inv) => `<li><span class="tn">${n}</span><span class="tv">${v ? fmtV(v) : '-'}</span>${v ? (inv
      ? `<span class="${v.d > 0 ? 'ret-dn' : 'ret-up'}">${v.d > 0 ? '+' : ''}${v.d.toFixed(2)}%</span>` : pc(v.d)) : ''}</li>`;
  // 계기판: 값이 눈금 위 어디에 있는지 (구간 색 + 기준선 + 바늘)
  const gauge = ({ name, v, min, max, rev, zones, marks, ghost, val, note }) => {
    if (v == null) return '';
    const at = x => Math.min(100, Math.max(0, rev ? (max - x) / (max - min) * 100 : (x - min) / (max - min) * 100));
    const z = zones.map(([a, b, c]) => { const l = Math.min(at(a), at(b)), r = Math.max(at(a), at(b));
      return `<i class="gz-${c}" style="left:${l}%;width:${r - l}%"></i>`; }).join('');
    const m = marks.map(([x, t]) => `<b class="gm" style="left:${at(x)}%"><span>${t}</span></b>`).join('');
    return `<div class="gg"><div class="ggh"><span>${name}</span><strong>${val}</strong></div>
      <div class="ggt">${z}${m}${ghost != null ? `<em class="ghost" style="left:${at(ghost)}%" title="최근 10일 최고"></em>` : ''}<u style="left:${at(v)}%"></u></div>
      <div class="ggn">${note}</div></div>`;
  };
  const b200 = br.find(b => b.k === 'kospi200'), b150 = br.find(b => b.k === 'kosdaq150');
  const brNote = b => `${b.now <= 20 ? '약세장' : b.now >= 50 ? '강세장' : '보통'}${b.d5 != null ? ` · 5일 ${b.d5 > 0 ? '+' : ''}${b.d5.toFixed(1)}%p` : ''}`;
  const gauges = [
    K && K.now.dd != null ? gauge({ name: '코스피 1년 최고가 대비', v: K.now.dd, min: -50, max: 0, rev: true, zones: [[-20, -50, 'cold']], marks: [[-20, '−20%']],
      val: `${K.now.dd}%`, note: `${K.now.dd <= -20 ? '많이 빠짐' : '정상 범위'}${K.now.gap != null ? ` · 120일선 대비 ${K.now.gap}%` : ''}` }) : '',
    ...[b200, b150].filter(b => b && b.now != null).map(b => gauge({ name: `${b.name} 체온계`, v: b.now, min: 0, max: 100,
      zones: [[0, 20, 'cold'], [50, 100, 'hot']], marks: [[20, '20'], [50, '50']], val: `${b.now}%`, note: brNote(b) })),
    VX ? gauge({ name: 'VIX 공포지수', v: VX.now, min: 10, max: 45, zones: [[30, 45, 'cold'], [10, 13, 'hot']], marks: [[13, '13'], [30, '30']], ghost: VX.max10,
      val: VX.now, note: `어젯밤 미국 · 최근 10일 최고 ${VX.max10}` }) : '',
  ].join('');
  // 바닥 확인 신호 2개: 켜졌는지, 과거에도 맞았는지
  const lamp = (label, list) => {
    const st = list.length ? (list.some(t => t.active && gaugeJudge(t)[0] === 'ok') ? 'on' : list.some(t => t.active) ? 'weak' : 'off') : 'off';
    return `<li class="lamp ${st}"><i></i>${label}<span>${st === 'on' ? '켜짐' : st === 'weak' ? '켜짐 · 과거엔 효과 없음' : '꺼짐'}</span></li>`;
  };
  const tests = id => g ? g.markets.map(m => m.tests.find(t => t.id === id)).filter(Boolean) : [];
  const lamps = g ? `<ul class="lamps">${lamp('VIX 급등 후 꺾임', tests('vix_turn').slice(0, 1))}${lamp('체온계 10% → 20% 회복', tests('br_up'))}</ul>` : '';
  // 3) 오늘 신호: 종목명을 바로 보여주고 누르면 차트
  const chipList = (k, arr, cls) => arr.length
    ? arr.map(x => `<button class="sn ${cls}" data-ix="${k}" data-code="${x.code}">${esc(x.name)}${x.g && cls === 'up' ? `<small>${x.g}</small>` : ''}</button>`).join('')
    : '<span class="none">없음</span>';
  const sigs = Object.entries(ix).map(([k, v]) => {
    const t = (v.data && v.data.today) || [];
    const up = t.filter(x => x.u && x.g !== 'C'), dn = t.filter(x => x.d === 'down'), pl = t.filter(x => x.d === 'pull');
    return `<div class="sigcol"><div class="sigh"><b>${INDEX[k].name}</b><button class="lnk" data-go="${k}">전체 보기</button></div>
      <div class="sigr"><span class="tri-up">▲ 상승 초입</span><div>${chipList(k, up, 'up')}</div></div>
      <div class="sigr"><span class="tri-pull">▽ 눌림</span><div>${chipList(k, pl, 'pull')}</div></div>
      <div class="sigr"><span class="tri-dn">▼ 하락 경고</span><div>${chipList(k, dn, 'dn')}</div></div></div>`;
  }).join('');
  // 4) 내 종목
  const mine = loadH();
  let holdTxt = '<span class="tag">등록된 종목이 없습니다. 종목 차트 아래 ‘내 종목에 추가’로 등록하면 여기서 손절선 상태를 알려 줍니다.</span>';
  if (mine.length) {
    const cnt = { r: 0, y: 0, g: 0, x: 0 }, red = [];
    for (const k of Object.keys(INDEX)) {
      const my = mine.filter(h => h.ix === k); if (!my.length) continue;
      const cd = await tryJ(INDEX[k].dir + 'charts.json');
      my.forEach(h => { const st = cd && cd.stocks[h.code]; const cs = st ? st.c.filter(v => v != null) : []; const cur = cs[cs.length - 1];
        if (cur == null) cnt.x++; else if (cur <= h.stop) { cnt.r++; red.push(h.name); } else if (cur / h.stop - 1 < 0.05) cnt.y++; else cnt.g++; });
    }
    holdTxt = `${cnt.r ? `<div class="alert danger" style="margin:0 0 6px"><b>🔴 손절선 이탈: ${red.map(esc).join(', ')}</b>미리 정한 규칙대로라면 정리할 시점입니다.</div>` : ''}
      🔴 이탈 ${cnt.r} · 🟡 근접 ${cnt.y} · 🟢 여유 ${cnt.g}${cnt.x ? ` · 가격 없음 ${cnt.x}` : ''}`;
  }
  panel().innerHTML = `
    <ul class="ticker" aria-label="최근 장 마감">${mk.map(x => tick(x)).join('')}${usk.map((x, i) => tick(x, i === 3)).join('')}
      <li class="tdate">한국 ${krDate} · 미국 ${usDate}</li></ul>
    <section class="cockpit ${cls}">
      <div class="verdict"><div class="hh">${head}</div><div class="ha">${advice}</div>
        <div class="lamph">바닥 확인 신호</div>${lamps}
        <button class="lnk" data-go="gauge">바닥·고점 근거 보기</button></div>
      <div class="gauges">${gauges}</div>
    </section>
    <section><div class="sec-head"><h2>장 마감 신호</h2><span class="count">${krDate} 기준 · 종목을 누르면 차트와 손절선</span></div>
      <div class="sigs">${sigs}</div></section>
    <section><div class="sec-head"><h2>내 종목</h2></div><div class="note" style="font-size:14px">${holdTxt}</div></section>
    ${ex('① 맨 위 결론으로 오늘이 관찰 구간인지 확인 → ② 내 종목에 🔴가 있으면 정한 대로 정리 → ③ 관찰 구간이 아니면 ▲ 종목을 눌러 차트·손절선 확인(과열·큰 흐름 하락 배지는 피하기) → ④ 한 달에 한 번 성적표의 실전 기록 확인', '📋 매일 보는 순서')}`;
  panel().querySelectorAll('button.sn').forEach(b => b.onclick = () => openChart(b.dataset.ix, b.dataset.code));
  panel().querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    state.tab = b.dataset.go; if (INDEX[state.tab]) state.view = 'today';
    try { history.replaceState(null, '', '#' + state.tab); } catch {} render(); window.scrollTo(0, 0); });
}

// ---------------------------------------------------------- 공통
async function render() {
  charts.forEach(c => c.destroy()); charts = [];
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  if (state.tab === 'gauge') renderConfirm(); else document.getElementById('confirm').innerHTML = '';
  try {
    if (INDEX[state.tab]) await renderAlignment(state.tab);
    else if (state.tab === 'sector') await renderSector();
    else if (state.tab === 'gauge') await renderGauge();
    else if (state.tab === 'oil') await renderOil();
    else if (state.tab === 'home') await renderHome();
    else await renderTrend(state.tab);
  } catch (e) {
    panel().innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.</div>';
  }
}

async function header() {
  const parts = [];
  for (const [k, v] of Object.entries(INDEX)) {
    try { const m = await getJSON(v.dir + 'dates.json'); parts.push(`${v.name} ${fmtTime(m.updated)}`); } catch {}
  }
  for (const [k, v] of [['us','미국'],['kr','국내 ETF']]) {
    try { const m = await getJSON(`data/${k}_trend.json`); parts.unshift(`${v} ${fmtTime(m.updated)}`); } catch {}
  }
  let base = '';
  try { const m = await getJSON(INDEX.kospi200.dir + 'dates.json'); base = `<b>${m.dates[0].slice(5).replace('-', '/')} 장 마감 기준</b> · 업데이트 ${fmtTime(m.updated)}`; } catch {}
  document.getElementById('updated').innerHTML = base || (parts.length ? '마지막 업데이트 — ' + parts.join(' / ') : '데이터 없음');
}

document.getElementById('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  state.tab = b.dataset.tab;
  try { history.replaceState(null, '', '#' + state.tab); } catch {}
  render();
};

document.getElementById('theme').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', theme); } catch {}
  applyTheme(theme); render();
};
applyTheme(theme);
const fromHash = location.hash.slice(1);
if (document.querySelector(`#tabs button[data-tab="${fromHash}"]`)) state.tab = fromHash;
header();
render();
</script>
</body>
</html>
